server:
  port: 8080

spring:
  application:
    name: tianyu-ai-backend
  threads:
    virtual:
      enabled: true
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/tianyu_ai_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted  # 对应实体类的属性名
      logic-not-delete-value: 0      # 逻辑未删除值（数据库默认值）
      logic-delete-value: 1          # 逻辑已删除值（取消点赞后的值）

wx:
  miniapp:
    appid: ${WX_APPID}
    secret: ${WX_SECRET}

# 腾讯云 COS 配置
cos:
  secretId: ${TENCENT_COS_ID}
  secretKey: ${TENCENT_COS_KEY}
  region: ap-beijing
  bucketName: tianyu-ai-1397278255
  baseUrl: https://tianyu-ai-1397278255.cos.ap-beijing.myqcloud.com

# AI
ai:
  zhipu:
    apiKey: ${ZHIPU_API_KEY}

# JWT配置
jwt:
  secret: tianyu-ai-admin-secret-key-2024
  expire-time: 86400000  # 24小时(毫秒)

# 天气预警聚合服务配置
weather:
  api:
    host: m56k5qd29w.re.qweatherapi.com
    api-key: cc7c368dba84425bb9a2b78949fe26d5
